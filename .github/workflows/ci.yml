name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-type-test:
    name: lint + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0
      - name: sync dev deps
        run: uv sync --extra dev
      - name: ruff
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest (unit)
        run: uv run pytest tests/unit -m unit

  rust:
    name: rustfmt + clippy + maturin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --manifest-path src/multicap/correlator_rs/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path src/multicap/correlator_rs/Cargo.toml -- -D warnings
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: maturin build
        run: uv tool run maturin build --manifest-path src/multicap/correlator_rs/Cargo.toml --release

  pyinstaller-smoke:
    name: PyInstaller one-folder smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0
      - name: sync deps
        run: uv sync --extra dev --extra ui --extra net
      - name: build one-folder bundle
        run: uv run --with pyinstaller pyinstaller packaging/pyinstaller/multicap.spec --noconfirm
      - name: verify bundled qt-material resources
        run: uv run python -c "from pathlib import Path; roots=[Path('dist/multicap/_internal'), Path('dist/MultiCap.app/Contents/Resources')]; expected=[root/'qt_material/resources/source/checkbox_indeterminate.svg' for root in roots]; found=[str(path) for path in expected if path.exists()]; assert found, expected; print(found[0])"
      - name: smoke — launch bundled binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/multicap/multicap.exe --smoke
          else
            ./dist/multicap/multicap --smoke
          fi

  windows-installers:
    name: Windows installer smoke (.exe + .msi, v1.6)
    needs: pyinstaller-smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: sync deps
        run: uv sync --extra dev --extra ui --extra net
      - name: build one-folder bundle
        run: uv run --with pyinstaller pyinstaller packaging/pyinstaller/multicap.spec --noconfirm
      - name: verify bundled qt-material resources
        run: uv run python -c "from pathlib import Path; expected=Path('dist/multicap/_internal/qt_material/resources/source/checkbox_indeterminate.svg'); assert expected.exists(), expected; print(expected)"
      # v1.6 dual Windows path — §5 Phase 0 smoke requires BOTH artifacts to build.
      - name: install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: build .exe (Inno Setup)
        run: iscc packaging\windows\multicap.iss
      - name: install WiX
        run: choco install wixtoolset --no-progress -y
      # v1.6 §5 R6 — heat.exe harvest dist\multicap into ComponentGroup MulticapComponents.
      - name: harvest PyInstaller bundle into WiX ComponentGroup
        shell: pwsh
        run: |
          $bundle = (Resolve-Path dist\multicap).Path
          heat dir $bundle `
            -cg MulticapComponents `
            -arch x64 `
            -gg -sfrag -srd -sreg -suid `
            -var var.SourceDir `
            -dr INSTALLFOLDER `
            -out packaging\windows\components.wxs
      - name: build .msi (WiX)
        shell: pwsh
        run: |
          $bundle = (Resolve-Path dist\multicap).Path
          candle packaging\windows\multicap.wxs packaging\windows\components.wxs -arch x64 -dSourceDir="$bundle" -dProductVersion="0.0.0" -out packaging\windows\
          light packaging\windows\multicap.wixobj packaging\windows\components.wixobj -out packaging\windows\multicap.msi
      # v1.6 §5 Phase 0 exit — silent-install + launch + uninstall smoke for BOTH artifacts.
      - name: silent-install / launch / uninstall (.exe)
        shell: pwsh
        run: |
          $exe = Get-ChildItem packaging\windows\Output\*.exe | Select-Object -First 1
          if (-not $exe) { throw "Inno Setup .exe not found under packaging\windows\Output\" }
          $installDir = Join-Path $env:RUNNER_TEMP "multicap-inno-install"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          $failure = $null
          Write-Host "Installing $($exe.FullName) silently..."
          try {
            Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir","/LOG=inno-install.log" -Wait -NoNewWindow
            $installed = Join-Path $installDir "multicap.exe"
            if (-not (Test-Path $installed)) { throw "Installed binary not found at $installed" }
            $resource = Join-Path $installDir "_internal\qt_material\resources\source\checkbox_indeterminate.svg"
            if (-not (Test-Path $resource)) { throw "qt-material source SVG not installed at $resource" }
            Write-Host "Launching installed binary..."
            $output = & $installed --smoke
            if ($output -notmatch "multicap GUI smoke ok") { throw "Unexpected launch output: $output" }
          } catch {
            $failure = $_
          } finally {
            Get-Process multicap -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | ForEach-Object {
              Write-Host "Stopping lingering smoke process $($_.Id)..."
              Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
            }
            $uninst = Join-Path $installDir "unins000.exe"
            if (Test-Path $uninst) {
              Write-Host "Uninstalling..."
              Start-Process -FilePath $uninst -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/FORCECLOSEAPPLICATIONS","/LOG=inno-uninstall.log" -Wait -NoNewWindow
            }
            for ($attempt = 1; $attempt -le 20 -and (Test-Path $installDir); $attempt++) {
              Start-Sleep -Milliseconds 500
              Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
            }
          }
          if ($failure) { throw $failure }
          if (Test-Path $installDir) {
            Get-ChildItem $installDir -Recurse -Force -ErrorAction SilentlyContinue | Format-Table FullName,Length
            throw "Uninstall left $installDir behind"
          }
      - name: silent-install / launch / uninstall (.msi)
        shell: pwsh
        run: |
          $msi = "packaging\windows\multicap.msi"
          if (-not (Test-Path $msi)) { throw "MSI not built at $msi" }
          $installDir = Join-Path $env:RUNNER_TEMP "multicap-msi-install"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          $failure = $null
          Write-Host "Installing $msi silently..."
          try {
            Start-Process msiexec -ArgumentList "/i","$msi","/qn","/norestart","INSTALLFOLDER=$installDir","/L*V","msi-install.log" -Wait -NoNewWindow
            $installed = Join-Path $installDir "multicap.exe"
            if (-not (Test-Path $installed)) { throw "Installed binary not found at $installed" }
            $resource = Join-Path $installDir "_internal\qt_material\resources\source\checkbox_indeterminate.svg"
            if (-not (Test-Path $resource)) { throw "qt-material source SVG not installed at $resource" }
            Write-Host "Launching installed binary..."
            $output = & $installed --smoke
            if ($output -notmatch "multicap GUI smoke ok") { throw "Unexpected launch output: $output" }
          } catch {
            $failure = $_
          } finally {
            Write-Host "Uninstalling..."
            Start-Process msiexec -ArgumentList "/x","$msi","/qn","/norestart" -Wait -NoNewWindow
          }
          if ($failure) { throw $failure }
          if (Test-Path (Join-Path $installDir "multicap.exe")) { throw "Uninstall left $installDir behind" }

  sbom-baseline:
    name: SBOM baseline check (§5 R6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: sync deps
        run: uv sync --extra dev --extra ui --extra net
      - name: regenerate SBOM
        run: bash packaging/sbom/generate.sh
      - name: diff against checked-in baseline
        run: git diff --exit-code packaging/sbom/ref/ || (echo "SBOM drift — commit updated baselines" && exit 1)
