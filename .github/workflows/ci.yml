name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-type-test:
    name: lint + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: sync dev deps
        run: uv sync --extra dev
      - name: ruff
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest (unit)
        run: uv run pytest -m unit

  rust:
    name: rustfmt + clippy + maturin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --manifest-path src/multicap/correlator_rs/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path src/multicap/correlator_rs/Cargo.toml -- -D warnings
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: maturin build
        run: uv tool run maturin build --manifest-path src/multicap/correlator_rs/Cargo.toml --release

  pyinstaller-smoke:
    name: PyInstaller one-folder smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: sync deps
        run: uv sync --extra dev --extra ui --extra net
      - name: build one-folder bundle
        run: uv run --with pyinstaller pyinstaller packaging/pyinstaller/multicap.spec --noconfirm
      - name: smoke — launch bundled binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/multicap/multicap.exe || true
          else
            ./dist/multicap/multicap || true
          fi

  windows-installers:
    name: Windows installer smoke (.exe + .msi, v1.6)
    needs: pyinstaller-smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: sync deps
        run: uv sync --extra dev --extra ui --extra net
      - name: build one-folder bundle
        run: uv run --with pyinstaller pyinstaller packaging/pyinstaller/multicap.spec --noconfirm
      # v1.6 dual Windows path — §5 Phase 0 smoke requires BOTH artifacts to build.
      - name: install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: build .exe (Inno Setup)
        run: iscc packaging\windows\multicap.iss
      - name: install WiX
        run: choco install wixtoolset --no-progress -y
      # v1.6 §5 R6 — heat.exe harvest dist\multicap into ComponentGroup MulticapComponents.
      - name: harvest PyInstaller bundle into WiX ComponentGroup
        shell: pwsh
        run: |
          $bundle = (Resolve-Path dist\multicap).Path
          heat dir $bundle `
            -cg MulticapComponents `
            -arch x64 `
            -gg -sfrag -srd -sreg -suid `
            -var var.SourceDir `
            -dr INSTALLFOLDER `
            -out packaging\windows\components.wxs
      - name: build .msi (WiX)
        shell: pwsh
        run: |
          $bundle = (Resolve-Path dist\multicap).Path
          candle packaging\windows\multicap.wxs packaging\windows\components.wxs -arch x64 -dSourceDir="$bundle" -out packaging\windows\
          light packaging\windows\multicap.wixobj packaging\windows\components.wixobj -out packaging\windows\multicap.msi
      # v1.6 §5 Phase 0 exit — silent-install + launch + uninstall smoke for BOTH artifacts.
      - name: silent-install / launch / uninstall (.exe)
        shell: pwsh
        run: |
          $exe = Get-ChildItem packaging\windows\Output\*.exe | Select-Object -First 1
          if (-not $exe) { throw "Inno Setup .exe not found under packaging\windows\Output\" }
          Write-Host "Installing $($exe.FullName) silently..."
          Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=inno-install.log" -Wait -NoNewWindow
          $searchRoots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ -and (Test-Path $_) }
          $installed = $searchRoots | ForEach-Object { Get-ChildItem $_ -Recurse -Filter multicap.exe -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $installed) { throw "Installed binary not found under expected install roots" }
          Write-Host "Launching installed binary..."
          $output = & $installed.FullName --version
          if ($output -notmatch "Phase 8b AP sniffer and wireless correlation") { throw "Unexpected launch output: $output" }
          $uninst = $searchRoots | ForEach-Object { Get-ChildItem $_ -Recurse -Filter unins000.exe -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $uninst) { throw "Uninstaller not found under expected install roots" }
          Write-Host "Uninstalling..."
          Start-Process -FilePath $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -NoNewWindow
          if (Test-Path $installed.FullName) { throw "Uninstall left $($installed.FullName) behind" }
      - name: silent-install / launch / uninstall (.msi)
        shell: pwsh
        run: |
          $msi = "packaging\windows\multicap.msi"
          if (-not (Test-Path $msi)) { throw "MSI not built at $msi" }
          Write-Host "Installing $msi silently..."
          Start-Process msiexec -ArgumentList "/i","$msi","/qn","/norestart","/L*V","msi-install.log" -Wait -NoNewWindow
          $installed = "C:\Program Files\multicap\multicap.exe"
          if (-not (Test-Path $installed)) { throw "Installed binary not found at $installed" }
          Write-Host "Launching installed binary..."
          $output = & $installed --version
          if ($output -notmatch "Phase 8b AP sniffer and wireless correlation") { throw "Unexpected launch output: $output" }
          Write-Host "Uninstalling..."
          Start-Process msiexec -ArgumentList "/x","$msi","/qn","/norestart" -Wait -NoNewWindow
          if (Test-Path $installed) { throw "Uninstall left $installed behind" }

  sbom-baseline:
    name: SBOM baseline check (§5 R6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: sync deps
        run: uv sync --extra dev --extra ui --extra net
      - name: regenerate SBOM
        run: bash packaging/sbom/generate.sh
      - name: diff against checked-in baseline
        run: git diff --exit-code packaging/sbom/ref/ || (echo "SBOM drift — commit updated baselines" && exit 1)
