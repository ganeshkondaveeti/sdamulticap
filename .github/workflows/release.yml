name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release-artifacts:
    name: Phase 10 release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
      - name: install Linux release tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0
          curl -L -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: install Windows release tools
        if: runner.os == 'Windows'
        run: |
          choco install innosetup wixtoolset --no-progress -y
      - name: import macOS Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PASSWORD"
          CERT_PATH="$RUNNER_TEMP/multicap-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/multicap-signing.keychain-db"
          uv run python -m multicap.release_tools MACOS_CERTIFICATE_P12_BASE64 "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" || {
            echo "Failed to import macOS signing certificate. MACOS_CERTIFICATE_P12_BASE64 must be a base64-encoded .p12/.pfx Developer ID Application certificate, and MACOS_CERTIFICATE_PASSWORD must match it."
            exit 1
          }
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: materialize Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CERT_BASE64) { throw "WINDOWS_CERT_BASE64 secret is required" }
          $certPath = Join-Path $env:RUNNER_TEMP "multicap-codesign.pfx"
          uv run python -m multicap.release_tools WINDOWS_CERT_BASE64 $certPath
          "WINDOWS_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: import Linux signing key
        if: runner.os == 'Linux'
        env:
          LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$LINUX_GPG_PRIVATE_KEY_BASE64"
          KEY_PATH="$RUNNER_TEMP/multicap-linux-signing-key.asc"
          uv run python -m multicap.release_tools LINUX_GPG_PRIVATE_KEY_BASE64 "$KEY_PATH" --allow-raw
          gpg --batch --import "$KEY_PATH" || {
            echo "Failed to import Linux signing key. LINUX_GPG_PRIVATE_KEY_BASE64 must be either a base64-encoded GPG private key or a raw ASCII-armored private key block."
            exit 1
          }
      - name: sync release dependencies
        run: uv sync --extra dev --extra ui --extra net
      - name: Phase 10 build, sign, notarize, SBOM
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          DPKG_SIG_KEY_ID: ${{ secrets.DPKG_SIG_KEY_ID }}
          GPG_SIGNING_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
        run: uv run python packaging/release.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: multicap-${{ runner.os }}-${{ github.ref_name }}
          path: |
            artifacts/**
